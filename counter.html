<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 class="counter-h1">My Character Counter</h1>
    <p>Feel free to write your thoughts below:</p>
    <div class="container">
        <textarea name="thoughts" id="thoughts" rows="5" cols="40" placeholder="Start typing your thoughts here..."></textarea>
        <div class="character-disp" id="character-disp">
            <p>Character Count: <span id="charCount">0/280 characters</span></p>
        </div>
        <button type="submit" class="submit-btn" id="submit-btn">Submit</button>
    </div>

    <script src="counter.js"></script>
</body>
</html>
